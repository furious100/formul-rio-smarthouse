<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Descubra sua fechadura ideal</title>
<style>
:root{--bg:#0b0d10;--card:rgba(255,255,255,.08);--bd:rgba(255,255,255,.18);--tx:#fff;--mut:#c9ced6;--ac:#e8b44c;--acx:#1a1203}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(circle at 20% 20%,#3a2c10,transparent 55%),radial-gradient(circle at 80% 80%,#16202e,transparent 55%),#0b0d10}
#bg video{width:100%;height:100%;object-fit:cover;filter:blur(6px) brightness(.55);transform:scale(1.06)}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45),rgba(0,0,0,.7))}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));min-height:100vh;display:flex;flex-direction:column}
.logo{height:64px;display:flex;align-items:center;justify-content:center;margin:6px 0 14px}
.logo img{max-height:64px;max-width:200px}
.bar{height:4px;background:var(--bd);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;width:0;background:var(--ac);transition:width .35s}
.step{display:none;flex:1;animation:in .35s}
.step.on{display:flex;flex-direction:column}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
h1{font-size:30px;line-height:1.1;margin:10px 0 12px;text-transform:uppercase}
h2{font-size:22px;margin:0 0 6px;line-height:1.2}
p.sub{color:var(--mut);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:10px 0 14px}
.opt{background:var(--card);border:1.5px solid var(--bd);color:var(--tx);border-radius:14px;padding:10px;font:inherit;text-align:center;cursor:pointer;backdrop-filter:blur(8px);transition:.15s;position:relative;display:flex;flex-direction:column;gap:8px}
.opt:hover{border-color:var(--ac)}
.opt.sel{border-color:var(--ac);background:rgba(232,180,76,.22)}
.opt.sel:after{content:"✓";position:absolute;top:8px;right:8px;background:var(--ac);color:var(--acx);width:22px;height:22px;border-radius:50%;font-size:14px;font-weight:800;display:grid;place-items:center}
.opt.txt{grid-column:1/-1;text-align:left;padding:16px}
.opt .img{width:100%;aspect-ratio:4/3;border-radius:10px;background:rgba(255,255,255,.1);overflow:hidden;display:grid;place-items:center;color:var(--mut);font-size:12px}
.opt .img img{width:100%;height:100%;object-fit:cover;display:block}
.opt .img.noimg img{display:none}
.opt .img:not(.noimg) span{display:none}
.opt b{font-size:16px;font-weight:700}
.opt small{color:var(--mut);font-size:13px;line-height:1.3}
.opt.tall .img{aspect-ratio:3/4}
.cta{margin-top:auto;background:var(--ac);color:var(--acx);border:0;border-radius:14px;padding:16px;font:inherit;font-weight:800;letter-spacing:.05em;cursor:pointer;width:100%}
.cta:disabled{opacity:.35;cursor:not-allowed}
.back{background:none;border:0;color:var(--mut);padding:12px;font:inherit;cursor:pointer;margin-top:6px}
input{width:100%;padding:15px;border-radius:12px;border:1.5px solid var(--bd);background:rgba(0,0,0,.35);color:var(--tx);font:inherit;margin-bottom:10px}
.err{color:#ff8d8d;font-size:14px;min-height:20px}
</style></head><body>
<div id="bg"><video autoplay muted loop playsinline src="fundo.mp4" onerror="this.remove()"></video></div>
<main>
  <div class="logo"><img src="logo.png" alt="Logo" onerror="this.style.display='none'"></div>
  <div class="bar"><i id="pb"></i></div>
  <div id="steps"></div>
  <button class="back" id="back" style="display:none">← Voltar</button>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
/* ====== SUPABASE ====== */
const SUPABASE_URL = "https://zimnxxlbqxyrrangmcxd.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ctcdhUMkMnTLnjbqF5g4QQ_ZS0jjl4X";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ====== VÍDEO DA TELA FINAL ======
   Opção 1: cole o link de um post/reel PÚBLICO do Instagram (ex.: https://www.instagram.com/reel/AbCdEf123/)
   Opção 2: deixe vazio ("") e coloque um arquivo video-final.mp4 na mesma pasta do index.html */
const INSTAGRAM_URL = "https://www.instagram.com/lukasfechaduras//";

/* ====== PERGUNTAS ======
   k = nome da coluna no banco | img = arquivo dentro da pasta img/ (opcional)
   Para trocar texto, foto ou ordem, edite só esta lista. */
const Q = [
 {k:'material', t:'Tipo de porta', s:'Em que tipo de porta vai instalar?', opts:[
   {v:'Madeira',img:'porta-madeira.png'},{v:'Alumínio',img:'porta-aluminio.png'},
   {v:'Vidro',img:'porta-vidro.png'},{v:'Portão',img:'porta-portao.png'}]},
 {k:'ja_possui', t:'Você já possui uma fechadura digital?', opts:[
   {v:'Sim, quero instalar ou substituir'},{v:'Não, quero comprar uma'},
   {v:'Já tenho uma fechadura convencional e quero trocar'}]},
 {k:'abertura', t:'Tipo de abertura da porta', opts:[
   {v:'De giro',d:'Abre para dentro ou para fora',img:'abertura-giro.png'},
   {v:'Pivotante/Dobradiça',img:'abertura-pivotante.png'},
   {v:'De correr',img:'abertura-correr.png'},
   {v:'É um portão',img:'abertura-portao.png'}]},
 {k:'estilo', t:'Qual estilo de fechadura você prefere?', s:'Compare e escolha', opts:[
   {v:'Embutir',d:'Remoção completa da fechadura atual.',img:'embutir.png',tall:1},
   {v:'Sobrepor',d:'Acima da fechadura atual.',img:'sobrepor.png',tall:1},
   {v:'Não sei qual melhor pra minha porta'}]},
 {k:'metodos', multi:1, t:'Como você gostaria de abrir sua fechadura?', s:'Pode marcar mais de um', opts:[
   {v:'Senha numérica',img:'acesso-senha.png'},{v:'Biometria',d:'Impressão digital',img:'acesso-biometria.png'},
   {v:'Cartão de acesso',img:'acesso-cartao.png'},{v:'Aplicativo no celular',img:'acesso-app.png'},
   {v:'Reconhecimento facial',img:'acesso-facial.png'},{v:'Palma da mão',img:'acesso-palma.png'}]},
 {k:'remoto', t:'Deseja controlar a fechadura à distância?', opts:[
   {v:'Sim, quero abrir a porta mesmo estando fora de casa',img:'remoto-fora.png'},
   {v:'Sim, quero acompanhar ou gerenciar os acessos',img:'remoto-gerenciar.png'},
   {v:'Não preciso deste recurso'},
   {v:'Não sei te dizer ainda'}]},
 {k:'espessura', t:'Qual a espessura da sua porta?', s:'Esta é a pergunta mais importante para a compatibilidade.', opts:[
   {v:'2,5',d:'Padrão Tenda',img:'espessura-2-5.png'},{v:'3,0',d:'Padrão geral',img:'espessura-3-0.png'},
   {v:'3,5',d:'Padrão geral',img:'espessura-3-5.png'},{v:'4,0',img:'espessura-4-0.png'}]},
 {k:'perfil_aparente', t:'Possui perfil aparente?', opts:[
   {v:'Sim',img:'perfil-sim.png'},{v:'Não',img:'perfil-nao.png'}]},
];

const $=s=>document.querySelector(s), ans={};
const total=Q.length+2;           // intro + perguntas + contato (+ final)
let cur=0, secs=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function card(o){
  const img=o.img?`<div class="img"><img src="img/${o.img}" alt="" onerror="this.parentNode.classList.add('noimg')"><span>foto: ${esc(o.img)}</span></div>`:'';
  return `<button class="opt ${o.img?'':'txt'} ${o.tall?'tall':''}" data-v="${esc(o.v)}">${img}<b>${esc(o.v)}</b>${o.d?`<small>${esc(o.d)}</small>`:''}</button>`;
}
function build(){
  let h=`<section class="step"><h1>Descubra agora sua fechadura ideal</h1>
    <p class="sub">Responda 8 perguntas rápidas e receba uma recomendação personalizada no seu WhatsApp.</p>
    <button class="cta" data-next>AVANÇAR</button></section>`;
  Q.forEach((q,i)=>{ h+=`<section class="step" data-i="${i}"><h2>${esc(q.t)}</h2><p class="sub">${esc(q.s||'Escolha uma opção')}</p>
    <div class="grid">${q.opts.map(card).join('')}</div>${q.multi?'<button class="cta" data-multi-next disabled>AVANÇAR</button>':''}</section>`; });
  h+=`<section class="step"><h2>Onde posso te mandar as recomendações?</h2><p class="sub">Em até 30 minutos iremos falar com você.</p>
    <input type="text" id="nome" placeholder="Seu nome" autocomplete="name">
    <input type="tel" id="zap" placeholder="WhatsApp com DDD" autocomplete="tel">
    <div class="err" id="err"></div><button class="cta" id="send">RECEBER MINHA RECOMENDAÇÃO</button></section>
    <section class="step"><h1>Pronto! 🎉</h1><p class="sub">Recebemos suas respostas. Em até 30 minutos iremos falar com você no WhatsApp com a fechadura ideal.</p><div id="fim-video"></div></section>`;
  $('#steps').innerHTML=h; secs=[...document.querySelectorAll('.step')];
  $('#steps').style.display='contents';
}
function go(i){
  cur=i; secs.forEach((s,n)=>s.classList.toggle('on',n===i));
  $('#pb').style.width=(i/(secs.length-1)*100)+'%';
  $('#back').style.display=(i>0&&i<secs.length-1)?'block':'none';
  scrollTo(0,0);
}
build(); go(0);
$('#back').onclick=()=>go(cur-1);
document.querySelector('[data-next]').onclick=()=>go(1);

Q.forEach((q,i)=>{
  const sec=secs[i+1], btns=[...sec.querySelectorAll('.opt')], sel=new Set();
  const nx=sec.querySelector('[data-multi-next]');
  btns.forEach(b=>b.onclick=()=>{
    const v=b.dataset.v;
    if(q.multi){ sel.has(v)?sel.delete(v):sel.add(v); b.classList.toggle('sel'); ans[q.k]=[...sel]; nx.disabled=!sel.size; }
    else{ btns.forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); ans[q.k]=v; setTimeout(()=>go(cur+1),250); }
  });
  if(nx) nx.onclick=()=>go(cur+1);
});

$('#send').onclick=async()=>{
  const nome=$('#nome').value.trim(), zap=$('#zap').value.replace(/\D/g,'');
  if(nome.length<2) return $('#err').textContent='Digite seu nome.';
  if(zap.length<10) return $('#err').textContent='Digite um WhatsApp válido com DDD.';
  $('#err').textContent=''; $('#send').disabled=true; $('#send').textContent='Enviando…';
  const { error } = await sb.from('leads').insert({...ans, nome, whatsapp:zap});
  if(error){
    $('#err').textContent='Não foi possível enviar agora. Tente novamente em instantes.';
    $('#send').disabled=false; $('#send').textContent='RECEBER MINHA RECOMENDAÇÃO';
  } else { showVideo(); go(secs.length-1); }
};
function showVideo(){
  const box=$('#fim-video'), m=INSTAGRAM_URL.match(/instagram\.com\/(p|reel|tv)\/([\w-]+)/);
  box.style.cssText='margin-top:10px;border-radius:14px;overflow:hidden';
  if(m) box.innerHTML=`<iframe src="https://www.instagram.com/${m[1]}/${m[2]}/embed" style="width:100%;height:560px;border:0;background:#fff" allowfullscreen loading="lazy"></iframe>`;
  else box.innerHTML=`<video src="video-final.mp4" autoplay muted loop playsinline controls style="width:100%;max-height:70vh;display:block;background:#000" onerror="this.parentNode.style.display='none'"></video>`;
}
</script>
</body></html>
